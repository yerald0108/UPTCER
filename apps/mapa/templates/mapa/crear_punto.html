{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear nuevo punto</title>
    <link rel="stylesheet" href="{% static 'mapa/vendor/maplibre-gl.css' %}">
    <style>
        body { background: #f8f9fa; padding: 20px; font-family: Arial, sans-serif; color: #1f2937; }
        .card { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 1200px; margin: auto; background: white; overflow: hidden; }
        .card-header { background: #0d6efd; color: white; padding: 16px 22px; }
        .card-body { padding: 22px; }
        #mini-mapa { height: 400px; border-radius: 8px; }
        .row { display: grid; grid-template-columns: minmax(0, 7fr) minmax(280px, 5fr); gap: 20px; }
        .row .row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .btn-sm { padding: 5px 9px; font-size: .85rem; }
        small { color: #64748b; font-size: .8rem; }
        .form-control, .form-select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 5px; font: inherit; }
        .form-label { display: block; margin-bottom: 5px; font-size: .9rem; font-weight: 600; }
        .mb-3 { margin-bottom: 14px; }
        .mb-0 { margin: 0; }
        .btn { display: inline-block; padding: 8px 12px; border: 1px solid #0d6efd; border-radius: 5px; color: #0d6efd; text-decoration: none; background: white; cursor: pointer; font: inherit; }
        .btn-primary { background: #0d6efd; color: white; }
        .btn-outline-secondary { border-color: #64748b; color: #475569; }
        .w-100 { width: 100%; }
        .instruccion { background: #fff3cd; padding: 10px 15px; border-radius: 8px; border-left: 4px solid #ffc107; margin-bottom: 15px; font-size: .9rem; }
        .alert { padding: 10px; border-radius: 6px; }
        .alert-danger { background: #fee2e2; color: #991b1b; }
        .alert-success { background: #dcfce7; color: #166534; }
        @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">➕ Crear nuevo punto</h3>
        </div>
        <div class="card-body">

            <div class="mb-3">
                <a href="{{ url_mapa }}" class="btn btn-outline-secondary btn-sm">← Volver al mapa</a>
            </div>

            <div class="instruccion">
                💡 <strong>Instrucción:</strong> Haz clic en el mapa para seleccionar la ubicación exacta.
            </div>

            <div class="row">
                <div class="col-md-7">
                    <div id="mini-mapa"></div>
                </div>
                <div class="col-md-5">
                    <form id="form-crear-punto">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <select class="form-select" name="tipo">
                                <option value="GENERICO">Genérico</option>
                                <option value="RADIOFARO_AEREO">Radiofaro Aéreo</option>
                                <option value="RADIOFARO_MARITIMO">Radiofaro Marítimo</option>
                                <option value="ANTENA_TORRE">Antena de Torre</option>
                                <option value="ANTENA_PANEL">Antena de Panel</option>
                                <option value="ANTENA_PARABOLICA">Antena Parabólica</option>
                                <option value="ANTENA_YAGI">Antena Yagi</option>
                                <option value="ANTENA_OMNIDIRECCIONAL">Antena Omnidireccional</option>
                                <option value="ESTACION_BASE">Estación Base</option>
                                <option value="ESTACION_MOVIL">Estación Móvil</option>
                                <option value="REPETIDORA">Repetidora</option>
                                <option value="SATELITE">Estación Satelital</option>
                                <option value="OTRO">Otro</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Latitud *</label>
                                <input type="number" step="any" class="form-control" name="latitud" id="latitud" required value="{{ lat_inicial }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Longitud *</label>
                                <input type="number" step="any" class="form-control" name="longitud" id="longitud" required value="{{ lon_inicial }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Responsable</label>
                            <input type="text" class="form-control" name="responsable">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" name="estado">
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                                <option value="MANTENIMIENTO">En mantenimiento</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Frecuencia (MHz)</label>
                            <input type="number" step="any" min="0" class="form-control" name="frecuencia_mhz">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Radio de cobertura estimado (km)</label>
                            <input type="number" step="any" min="0.01" max="1000" class="form-control" name="radio_km"
                                   placeholder="Déjelo vacío si no está definido">
                            <small>El radio es manual y solo permite comparar áreas geométricas.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Atributos extra (JSON)</label>
                            <textarea class="form-control" name="atributos" rows="2"
                                      placeholder='{"frecuencia_mhz": 113.6, "potencia_w": 50}'></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">💾 Guardar punto</button>
                    </form>

                    <div id="mensaje" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.MAPA_BASEMAP_URL = "{% url 'mapa:pmtiles' %}";
        window.MAPA_LIMITES_URL = "{% static 'mapa/data/cuba_municipios.geojson' %}";
        window.MAPA_GLYPHS_URL = "{% static 'mapa/vendor/fonts/' %}" + decodeURIComponent("%7Bfontstack%7D/%7Brange%7D.pbf");
        window.MAPA_SPRITES_URL = "{% static 'mapa/vendor/sprites/light' %}";
        window.MAPA_CREAR_CONFIG = {
            apiUrl: "{% url 'mapa:api_crear_punto' %}",
            urlMapa: "{% url 'mapa:mapa' %}"
        };
    </script>
    <script src="{% static 'mapa/vendor/pmtiles.js' %}"></script>
    <script src="{% static 'mapa/vendor/basemaps.js' %}"></script>
    <script type="module" src="{% static 'mapa/js/mapa-crear.js' %}?v=3"></script>
</body>
</html>
