<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>{{ titulo }}</title>

<style>

body{
    margin:0;
    padding:0;
    background:#f3f4f6;
    font-family:Arial,Helvetica,sans-serif;
}

.wrapper{

    width:100%;
    padding:30px;

}

.card{

    max-width:760px;
    margin:auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.15);

}

.header{

    background:#0d6efd;
    color:white;
    padding:25px;

}

.header h1{

    margin:0;
    font-size:24px;

}

.body{

    padding:30px;

}

.body p{

    line-height:1.7em;
    color:#444;

}

.info{

    margin-top:20px;
    border:1px solid #DDD;
    border-radius:6px;
    padding:20px;
    background:#fafafa;

}

.info table{

    width:100%;

}

.info td{

    padding:8px;

}

.label{

    width:180px;
    font-weight:bold;

}

.button{

    display:inline-block;
    margin-top:25px;
    padding:14px 25px;
    color:white;
    background:#0d6efd;
    text-decoration:none;
    border-radius:6px;

}

.footer{

    background:#f5f5f5;
    padding:20px;
    text-align:center;
    color:#777;
    font-size:13px;

}

</style>

</head>

<body>

<div class="wrapper">

<div class="card">

<div class="header">

<h1>{{ app_nombre }}</h1>

</div>

<div class="body">

{% block contenido %}

{% endblock %}

</div>

<div class="footer">

Este correo fue generado automáticamente.<br>

{{ app_nombre }}

</div>

</div>

</div>

</body>

</html>
